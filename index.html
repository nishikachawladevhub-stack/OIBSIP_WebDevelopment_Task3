<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Daily To‑Do</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <div>
          <h1>Daily To‑Do</h1>
          <p class="subtitle">Capture, complete, and track your day at a glance.</p>
        </div>
        <div class="status-pill">
          <span id="total-count">0</span> tasks today
        </div>
      </header>

      <main>
        <section class="card">
          <h2>Add a new task</h2>
          <form id="task-form" class="task-form">
            <label class="field">
              <span class="field-label">Task</span>
              <input
                type="text"
                id="task-input"
                placeholder="e.g. Finish reading chapter 3"
                autocomplete="off"
                required
              />
            </label>
            <button type="submit" class="btn primary">Add Task</button>
          </form>
        </section>

        <section class="lists-grid">
          <section class="card">
            <header class="card-header">
              <div>
                <h2>Pending Tasks</h2>
                <p class="muted">
                  Tasks that are yet to be completed.
                </p>
              </div>
              <span class="pill pill-pending"><span id="pending-count">0</span> pending</span>
            </header>
            <ul id="pending-list" class="task-list empty-state">
              <li class="empty-message">No pending tasks. Add something above.</li>
            </ul>
          </section>

          <section class="card">
            <header class="card-header">
              <div>
                <h2>Completed Tasks</h2>
                <p class="muted">
                  Everything you've checked off.
                </p>
              </div>
              <span class="pill pill-completed"><span id="completed-count">0</span> done</span>
            </header>
            <ul id="completed-list" class="task-list empty-state">
              <li class="empty-message">No completed tasks yet.</li>
            </ul>
          </section>
        </section>
      </main>
    </div>

    <template id="task-item-template">
      <li class="task-item">
        <div class="task-main">
          <input type="checkbox" class="task-toggle" />
          <div class="task-text-block">
            <span class="task-text"></span>
            <span class="task-meta"></span>
          </div>
        </div>
        <div class="task-actions">
          <button class="btn ghost btn-edit" type="button">Edit</button>
          <button class="btn ghost btn-delete" type="button">Delete</button>
        </div>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
